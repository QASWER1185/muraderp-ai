name: Phase 13 Closure Verification

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  phase13:
    name: Phase 13 AI Assistant closure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Phase 13 tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Runtime import smoke test
        run: node --input-type=module -e "import('./dist/ai-assistant/index.js').then((m) => { if (typeof m.createAssistantService !== 'function') throw new Error('Phase 13 assistant export missing'); console.log('Phase 13 runtime import OK'); })"
