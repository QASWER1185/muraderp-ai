name: Stage 8 Performance Acceptance

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'scripts/stage8-performance.mjs'
      - '.github/workflows/stage8-performance.yml'
      - 'docs/PHASE-23-STAGE-8-ACCEPTANCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage8-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Performance evidence and full regression timing
        run: node scripts/stage8-performance.mjs
      - name: Production build
        working-directory: backend
        run: npm run build
