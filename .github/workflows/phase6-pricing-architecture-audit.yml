name: Phase 6 Pricing Architecture Audit

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: phase6-pricing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pricing-architecture:
    name: Phase 6 Pricing Architecture Production Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout integrity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
        working-directory: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Phase 6 pricing repository tests
        run: npm test -- repositories/rate-list.repository.test.ts repositories/pricing.repository.test.ts

      - name: Phase 6 pricing service tests
        run: npm test -- services/rate-list.service.test.ts services/rate-list.lifecycle.test.ts services/pricing.service.test.ts services/pricing.validation.test.ts

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend production build
        run: npm run build

      - name: Full backend regression suite
        run: npm test

      - name: Final Phase 6 gate
        run: echo "PHASE_6_PRICING_ARCHITECTURE_FINAL_PASS"
