name: Phase 6 Pricing Architecture Audit
run-name: Phase 6 Pricing Production Audit - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pricing-architecture:
    name: Phase 6 Pricing Architecture Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify runner and checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependency installation
        working-directory: backend
        run: npm ci --include=dev --no-audit --no-fund

      - name: Phase 6 complete regression
        working-directory: backend
        run: npm test

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend production build
        working-directory: backend
        run: npm run build

      - name: Verify pricing migration
        shell: bash
        run: test -f supabase/migrations/20260813132000_pricing_rate_list_foundation.sql

      - name: Final Phase 6 gate
        shell: bash
        run: |
          echo "PHASE_6_PRICING_ARCHITECTURE_FINAL_PASS"
          echo "COMMIT: ${GITHUB_SHA}"
