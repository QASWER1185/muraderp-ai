name: Production Security Gate

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "maintenance/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: production-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Dependency and secret hygiene
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check tracked files for private key material
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- \
            '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|-----BEGIN PGP PRIVATE KEY BLOCK-----' \
            -- ':!backend/package-lock.json' ':!package-lock.json' ':!.github/workflows/production-security-gate.yml'; then
            echo 'Private key material detected in tracked files.' >&2
            exit 1
          fi

      - name: Check source for server credential exposure markers
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|INTERNAL_API_TOKEN)[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]{8,}' -- frontend backend/src; then
            echo 'Potential hard-coded server credential detected in application source.' >&2
            exit 1
          fi
