name: Phase 7A Authoritative Final Gate
run-name: Phase 7A Final Gate - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7a-final-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'const m=process.versions.node.match(/^(\\d+)\\./); if (!m || Number(m[1]) < 22) process.exit(1)'

      - name: Verify Phase 7A files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/migrations/20260814100000_customer_payments_receivables_foundation.sql
            supabase/migrations/20260824170000_phase7a_customer_payment_idempotency_concurrency_hardening.sql
            backend/package-lock.json
            backend/test/customer-payment.test.ts
          )
          for f in "${files[@]}"; do test -f "$f"; done

      - name: Install dependencies
        working-directory: backend
        shell: bash
        run: npm ci --include=dev --no-audit --no-fund

      - name: Test
        working-directory: backend
        shell: bash
        run: npm test

      - name: Typecheck
        working-directory: backend
        shell: bash
        run: npm run typecheck

      - name: Build
        working-directory: backend
        shell: bash
        run: npm run build

      - name: FINAL GATE
        shell: bash
        run: |
          set -euo pipefail
          echo PHASE_7A_FINAL_PASS
          echo "COMMIT=$GITHUB_SHA"
