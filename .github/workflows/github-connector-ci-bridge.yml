name: GitHub Connector CI Bridge

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  statuses: write

jobs:
  connector-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        id: typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Tests
        id: tests
        working-directory: backend
        run: npm test -- --run

      - name: Production build
        id: build
        working-directory: backend
        run: npm run build

      - name: Publish connector-visible commit status
        if: always()
        uses: actions/github-script@v7
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const outcomes = [
              process.env.TYPECHECK_OUTCOME,
              process.env.TESTS_OUTCOME,
              process.env.BUILD_OUTCOME,
            ];
            const success = outcomes.every((value) => value === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'github-connector/ci-verification',
              description: success
                ? 'Connector-visible CI verification passed'
                : 'Connector-visible CI verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!success) core.setFailed('Connector-visible CI verification failed');
