name: Phase 6 Runner Smoke Gate
run-name: Phase 6 Runner Smoke Gate - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Phase 6 Authoritative Runner Smoke Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "checkout=${GITHUB_SHA}"

      - name: Verify Node and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Authoritative runner PASS
        shell: bash
        run: echo "PHASE_6_RUNNER_SMOKE_PASS"
