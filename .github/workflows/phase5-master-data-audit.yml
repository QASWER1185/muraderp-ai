name: Phase 5 Master Data Audit
run-name: Phase 5 Production Audit - ${{ github.ref_name }} - ${{ github.sha }}

"on":
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-master-data-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  master-data-audit:
    name: Phase 5 Master Data + Frontend Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checkout integrity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --include=dev --no-audit --no-fund

      - name: Phase 5 backend acceptance tests
        working-directory: backend
        run: npm test -- erp.master-data.test.ts

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend production build
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --no-audit --no-fund

      - name: Ensure Phase 5 test runner
        working-directory: frontend
        run: npm install --include=dev --no-save --no-audit --no-fund vitest@3.2.4

      - name: Verify Phase 5 test runner
        working-directory: frontend
        shell: bash
        run: test -x node_modules/.bin/vitest

      - name: Phase 5 frontend acceptance tests
        working-directory: frontend
        run: npm run test:phase5

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Final Phase 5 gate
        shell: bash
        run: |
          echo "PHASE 5 PRODUCTION AUDIT: PASS CANDIDATE"
          echo "COMMIT: ${GITHUB_SHA}"
